[package]
name = "hostab"
version = "0.0.4"
edition = "2021"
description = "Your dev tool to manage /etc/hosts like a pro — written in Rust"
license = "MIT"
repository = "https://github.com/dyrnq/hostab"

[[bin]]
name = "hostab"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
clap_complete = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13"
glob = "0.3"
tabled = "0.22"
fs4 = "1.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "3.4", features = ["json"] }
libc = "0.2"
axum = "0.8"
tower-http = { version = "0.7", features = ["cors", "limit"] }
tower = { version = "0.5", features = ["limit"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
hickory-resolver = "0.26"
tokio = { version = "1.53", features = ["rt", "net", "macros"] }

tempfile = "3.27"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"

[build-dependencies]
chrono = "0.4"
