[package]
name = "hostab"
version = "0.0.2"
edition = "2021"
description = "Your dev tool to manage /etc/hosts like a pro — written in Rust"
license = "MIT"
repository = "https://github.com/dyrnq/hostab"

[[bin]]
name = "hostab"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
glob = "0.3"
tabled = "0.21"
fs2 = "0.4"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
ureq = "3"
atty = "0.2"
libc = "0.2"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
hickory-resolver = "0.26"
tokio = { version = "1", features = ["rt", "net", "macros"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[build-dependencies]
chrono = "0.4"
